<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NDPS — Earned Wage Access</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #ddd; font-family: var(--font-sans); }
  .phone {
    width: 390px; height: 760px; margin: 20px auto; background: var(--bg-layout);
    border-radius: 36px; box-shadow: 0 20px 50px rgba(0,0,0,0.25); overflow: hidden; position: relative;
    display: flex; flex-direction: column;
  }
  .statusbar { height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 13px; font-weight: 600; color: var(--text-heading); }
  .content { flex: 1; overflow-y: auto; position: relative; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>NDPS</span></div>
  <div class="content"><div id="root"></div></div>
</div>
<script type="text/babel" src="DashboardScreen.jsx"></script>
<script type="text/babel" src="WithdrawScreen.jsx"></script>
<script type="text/babel" src="HistoryScreen.jsx"></script>
<script type="text/babel">
const { useState } = React;

function App() {
  const [screen, setScreen] = useState("dashboard");
  const [lastWithdrawal, setLastWithdrawal] = useState(null);

  if (screen === "withdraw") {
    return (
      <WithdrawScreen
        onBack={() => setScreen("dashboard")}
        onConfirm={() => { setLastWithdrawal("2,000"); setScreen("history"); }}
      />
    );
  }
  if (screen === "history") {
    return <HistoryScreen onBack={() => setScreen("dashboard")} justWithdrew={lastWithdrawal} />;
  }
  return <DashboardScreen onWithdraw={() => setScreen("withdraw")} onHistory={() => setScreen("history")} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
