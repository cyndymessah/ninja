<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 20px; background: var(--bg-layout); font-family: var(--font-sans); color: var(--text-default); }
  .sizes { display: flex; gap: 20px; align-items: center; padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--border-default); }
  .size { display: flex; gap: 8px; align-items: center; font-family: var(--font-meta); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px 10px; }
  .cell { display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; }
  .cell span { font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Icon } = window.NDPSDesignSystem_82df03;
const NAMES = ["alert","approve","back","calendar","companies","dashboard","disbursement","export","menu","refresh","reject","report","requests","rupee","search","trendDown","trend","users"];
function Demo() {
  return (
    <div>
      <div className="sizes">
        <div className="size"><Icon name="approve" size="sm" />sm 16</div>
        <div className="size"><Icon name="approve" size="md" />md 20</div>
        <div className="size"><Icon name="approve" size="lg" />lg 24</div>
      </div>
      <div className="grid">
        {NAMES.map(n => <div className="cell" key={n}><Icon name={n} /><span>{n}</span></div>)}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
