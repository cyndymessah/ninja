            <div><div className="logolabel">On dark</div><div className="logopanel on-dark"><img src="../../assets/adaptis-nttdata-logo-on-dark.png" alt="ADAPTIS by NTT DATA on dark" /></div></div>

      <Page label="Components">

          <p>NTT DATA Payment Services / Ninja Design System / v1.0</p>

        <Section title="Button">
          <div className="stack">
            <div className="flow"><Button type="primary">Primary</Button><Button type="default">Default</Button><Button type="neutral">Neutral</Button><Button type="text">Text</Button><Button type="primary" disabled>Disabled</Button></div>
            <div className="flow"><Button size="small">Small</Button><Button size="medium">Medium</Button><Button size="large">Large</Button></div>
          </div>
        </Section>
        <Section title="Tag">
          <div className="flow"><Tag variant="primary">Primary</Tag><Tag variant="success">Success</Tag><Tag variant="warning">Warning</Tag><Tag variant="error">Error</Tag><Tag variant="neutral">Neutral</Tag></div>
        </Section>
        <Section title="Alert">
          <div className="stack">
            <Alert variant="info" title="Heads up" description="This is an informational message." />

          <QuickAmountInput label="Add money" value="5,000" presets={["1,000","2,500","5,000","Max"]} selectedIndex={2} />

        <Section title="Descriptions">
          <Descriptions title="General information" items={[

            { label: "Country", value: "India" },
            { label: "Office address", value: "Plot 12, Sector 18, Gurugram" },

        <Section title="Innovation Curve (brand graphic - dark surfaces only)">
          <div style={{ background: "var(--core-navy-smart)", borderRadius: "var(--radius-card-px)", padding: 40, display: "flex", gap: 40, justifyContent: "center" }}>
            {InnovationCurve ? <span style={{display:"flex",gap:40}}><InnovationCurve variant="wireframe" size={180} /><InnovationCurve variant="solid" size={180} /></span> : null}
          </div>
        </Section>
      </Page>
    </div>

}
