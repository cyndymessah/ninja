<!-- @dsCard group="Type" viewport="700x300" name="UI Type — Noto Sans" subtitle="Heading-3 / body-lg / body / caption" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--bg-container); display: flex; flex-direction: column; gap: 10px; }
  .h3 { font-family: var(--text-heading-3-family); font-size: var(--text-heading-3-size); line-height: var(--text-heading-3-line); font-weight: var(--text-heading-3-weight); color: var(--text-heading); }
  .lg { font-family: var(--text-body-lg-family); font-size: var(--text-body-lg-size); line-height: var(--text-body-lg-line); font-weight: var(--text-body-lg-weight); color: var(--text-heading); }
  .body { font-family: var(--text-body-family); font-size: var(--text-body-size); line-height: var(--text-body-line); font-weight: var(--text-body-weight); color: var(--text-body); }
  .caption { font-family: var(--text-caption-family); font-size: var(--text-caption-size); line-height: var(--text-caption-line); font-weight: var(--text-caption-weight); color: var(--text-secondary); }
</style>
</head>
<body>
  <div class="h3">How this is calculated</div>
  <div class="lg">Money you have earned this cycle.</div>
  <div class="body">Withdrawals reopen after payday.</div>
  <div class="caption">Minimum ₹1,000 · Eligible ₹640</div>
</body>
</html>
