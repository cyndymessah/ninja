<!-- @dsCard group="Brand" viewport="380x560" name="Feature Card" subtitle="Dark financial summary card — the signature NDPS surface" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 16px; background: var(--bg-layout); }
  .card { position: relative; width: 320px; border-radius: 20px; background: var(--core-navy-smart); box-shadow: inset 0 0 0 1px var(--core-gray-100); padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; overflow: hidden; }
  .curve { position: absolute; right: -60px; bottom: -80px; width: 320px; height: 320px; opacity: 0.5; pointer-events: none; }
  .curve svg { width: 100%; height: 100%; }
  .head { display: flex; align-items: center; gap: 6px; }
  .amt-label { font-family: var(--font-sans); font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.65); }
  .info { width: 15px; height: 15px; border-radius: 99px; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.4); color: rgba(255,255,255,0.55); font: 600 10px/15px var(--font-sans); text-align: center; }
  .amt { font-family: var(--font-display); font-weight: 700; font-size: 52px; line-height: 1; color: var(--core-white); margin-top: 8px; }
  .track { height: 7px; border-radius: 99px; background: rgba(255,255,255,0.16); }
  .fill { height: 100%; width: 30%; border-radius: 99px; background: var(--core-blue-50); }
  .range { display: flex; justify-content: space-between; font-family: var(--font-sans); font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 10px; }
  .stats { display: flex; gap: 16px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
  .stat { flex: 1; }
  .stat-label { font-family: var(--font-sans); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.45); }
  .stat-val { font-family: var(--font-display); font-weight: 600; font-size: 24px; color: var(--core-white); margin-top: 6px; }
  .actions { position: relative; }
</style>
</head>
<body>
<div class="card">
  <div class="curve"><svg viewBox="0 0 200 200" fill="none"><path d="M-20 210 C 40 150, 60 90, 210 -20" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/><path d="M-20 240 C 60 170, 80 100, 240 -20" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/></svg></div>
  <div>
    <div class="head">
      <span class="amt-label">Available to withdraw today</span>
      <span class="info">i</span>
    </div>
    <div class="amt">₹9,500</div>
  </div>
  <div>
    <div class="track"><div class="fill"></div></div>
    <div class="range"><span>₹4,000 withdrawn</span><span>₹13,500 cap</span></div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-label">Working days</div><div class="stat-val">18/30</div></div>
    <div class="stat"><div class="stat-label">Earned so far</div><div class="stat-val">₹27,000</div></div>
  </div>
  <div class="actions" id="btns"></div>
</div>
<script type="text/babel">
const { Button } = window.NDPSDesignSystem_82df03;
ReactDOM.createRoot(document.getElementById("btns")).render(
  <Button type="primary" size="large" style={{width: "100%"}}>Withdraw money</Button>
);
</script>
</body>
</html>
