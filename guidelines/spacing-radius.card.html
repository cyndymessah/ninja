<!-- @dsCard group="Spacing" viewport="700x180" name="Radius Scale" subtitle="radius/base, radius/card, radius/pill + component radii" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--bg-container); font-family: var(--font-meta); display: flex; gap: 20px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .box { width: 64px; height: 64px; background: var(--color-primary-bg); box-shadow: inset 0 0 0 1px var(--color-primary); }
  .label { font-size: 11px; color: var(--text-secondary); }
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-radius: var(--radius-sm-px)"></div><div class="label">radius/sm · 4px</div></div>
  <div class="item"><div class="box" style="border-radius: var(--radius-base-px)"></div><div class="label">radius/base · 8px</div></div>
  <div class="item"><div class="box" style="border-radius: var(--radius-card-px)"></div><div class="label">radius/card · 16px</div></div>
  <div class="item"><div class="box" style="border-radius: var(--radius-pill-px)"></div><div class="label">radius/pill · 999px</div></div>
</body>
</html>
