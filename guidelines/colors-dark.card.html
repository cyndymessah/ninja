<!-- @dsCard group="Colors" viewport="700x260" name="Semantic Tokens (Dark)" subtitle="Same tokens, dark theme values" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--core-navy-smart); font-family: var(--font-sans); }
  .box[data-theme="dark"] { padding: 16px; border-radius: 12px; background: var(--bg-container); }
  .row { display: flex; gap: 16px; align-items: center; padding: 6px 0; }
  .sw { width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0; }
  .label { font-size: 12px; color: var(--text-body); font-family: var(--font-meta); }
</style>
</head>
<body>
  <div class="box" data-theme="dark">
    <div class="row"><div class="sw" style="background: var(--color-primary)"></div><div class="label">color/primary</div></div>
    <div class="row"><div class="sw" style="background: var(--bg-layout)"></div><div class="label">bg/layout</div></div>
    <div class="row"><div class="sw" style="background: var(--text-heading)"></div><div class="label" style="color:var(--text-heading)">text/heading</div></div>
    <div class="row"><div class="sw" style="background: var(--status-success)"></div><div class="label">status/success</div></div>
    <div class="row"><div class="sw" style="background: var(--status-error)"></div><div class="label">status/error</div></div>
  </div>
</body>
</html>
